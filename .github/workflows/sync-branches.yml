# 自動分支同步工作流 - 簡化版本
# 採用最基礎的 bash 邏輯，確保最高可靠性

name: 自動分支同步

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-develop:
    name: 同步 main 到 develop 分支
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 拉取所有分支
        run: |
          git fetch --all --verbose

      - name: ✅ 檢查 develop 分支
        id: check-develop
        run: |
          echo "開始檢查 develop 分支..."
          if git ls-remote --heads origin develop | grep -q develop; then
            echo "develop_exists=yes" >> "$GITHUB_OUTPUT"
            echo "✅ develop 分支已存在"
          else
            echo "develop_exists=no" >> "$GITHUB_OUTPUT"
            echo "📌 develop 分支不存在"
          fi

      - name: 🆕 創建 develop 分支（如果不存在）
        if: steps.check-develop.outputs.develop_exists == 'no'
        run: |
          echo "正在創建 develop 分支..."
          git checkout -b develop origin/main
          git push origin develop -v
          echo "✅ develop 分支已創建"

      - name: 🔀 合併 main 到 develop
        run: |
          echo "準備合併 main 到 develop..."
          
          # 切換到 develop 分支
          git checkout develop
          echo "已切換到 develop 分支"
          
          # 拉取最新內容
          git pull origin develop --verbose
          echo "已拉取最新 develop 內容"
          
          # 嘗試合併
          echo "開始合併 main..."
          if git merge origin/main -m "chore(sync): 自動同步 main 到 develop"; then
            echo "✅ 合併成功"
            
            # 推送到遠端
            echo "正在推送到遠端..."
            git push origin develop -v
            echo "✅ 推送成功"
            
            # 標記成功
            echo "MERGE_SUCCESS=true" >> "$GITHUB_ENV"
          else
            echo "⚠️ 合併失敗（可能是衝突）"
            git merge --abort
            echo "MERGE_SUCCESS=false" >> "$GITHUB_ENV"
          fi

      - name: 📊 輸出結果
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 分支同步完成"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ "$MERGE_SUCCESS" = "true" ]; then
            echo ""
            echo "✅ 狀態：同步成功"
            echo "📍 已將 main 同步到 develop"
            echo "⏰ 完成時間：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
          else
            echo ""
            echo "⚠️ 狀態：同步失敗或發生衝突"
            echo "👉 需要手動解決"
            echo ""
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
