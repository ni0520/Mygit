# 自動分支同步工作流
# main 分支有更新時自動同步到 develop 分支
# 若 develop 分支不存在則自動創建
# 合併衝突時創建 PR 提醒手動處理

name: 自動分支同步

on:
  push:
    branches:
      - main
  # 支持手動觸發
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-to-develop:
    name: 同步 main 到 develop 分支
    runs-on: ubuntu-latest

    steps:
      # 步驟 1：檢出代碼（包含所有分支）
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步驟 2：配置 Git 用戶
      - name: 配置 Git 用戶
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 步驟 3：獲取所有遠端分支信息
      - name: 獲取遠端分支信息
        run: git fetch --all

      # 步驟 4：檢查 develop 分支是否存在，不存在則創建
      - name: 檢查並創建 develop 分支
        id: check-develop
        run: |
          if git ls-remote --exit-code --heads origin develop; then
            echo "develop_exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ develop 分支已存在"
          else
            echo "develop_exists=false" >> "$GITHUB_OUTPUT"
            echo "📌 develop 分支不存在，將從 main 創建"
          fi

      - name: 創建 develop 分支（若不存在）
        if: steps.check-develop.outputs.develop_exists == 'false'
        run: |
          git checkout -b develop origin/main
          git push origin develop
          echo "✅ 已從 main 創建 develop 分支"

      # 步驟 5：準備合併訊息（修復版本）
      - name: 準備合併訊息
        id: prepare-merge
        run: |
          # 生成時間戳記
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          
          # 直接使用字符串替換，避免 sed 的特殊字符衝突
          MERGE_MSG="chore(sync): 自動同步 main 到 develop
          
          由 GitHub Actions 自動同步
          來源提交：${{ github.sha }}
          觸發時間：${TIMESTAMP}"
          
          # 使用 EOF 分隔符安全地存儲多行訊息
          echo "merge_message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MERGE_MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          
          echo "📝 合併訊息已準備完成"

      # 步驟 6：嘗試將 main 合併到 develop
      - name: 合併 main 到 develop
        id: merge
        env:
          MERGE_MSG: ${{ steps.prepare-merge.outputs.merge_message }}
        run: |
          git checkout develop
          git pull origin develop

          # 嘗試合併 main
          if git merge origin/main --no-edit -m "$MERGE_MSG"; then
            git push origin develop
            echo "merge_status=success" >> "$GITHUB_OUTPUT"
            echo "✅ 成功將 main 同步到 develop"
          else
            git merge --abort
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            echo "⚠️ 合併衝突，將創建 PR 提醒手動處理"
          fi

      # 步驟 7：若有衝突，創建臨時分支並發起 PR
      - name: 創建衝突解決分支
        if: steps.merge.outputs.merge_status == 'conflict'
        id: conflict-branch
        run: |
          # 使用 ISO 8601 格式的時間戳記，確保唯一性
          BRANCH="sync/main-to-develop-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          echo "📌 已創建衝突解決分支：$BRANCH"

      - name: 創建衝突解決 PR
        if: steps.merge.outputs.merge_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictBranch = '${{ steps.conflict-branch.outputs.branch_name }}';
            const triggerTime = '${{ steps.prepare-merge.outputs.timestamp }}';

            // 驗證分支名稱是否正確
            if (!conflictBranch || conflictBranch.includes('$')) {
              throw new Error('衝突解決分支名稱為空或包含未替換的變數');
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ [需手動處理] 同步 main 到 develop 發生衝突',
              body: `## ⚠️ 分支同步衝突

自動同步 \`main\` 到 \`develop\` 時發生合併衝突，需要手動處理。

### 衝突信息
- 來源分支：\`main\`
- 目標分支：\`develop\`
- 衝突解決分支：\`${conflictBranch}\`
- 觸發提交：\`${{ github.sha }}\`
- 觸發時間：${triggerTime}

### 解決步驟

#### 方案 A：在本地解決（推薦）
\`\`\`bash
# 1. 拉取最新代碼
git fetch origin

# 2. 切換到 develop 分支
git checkout develop
git pull origin develop

# 3. 嘗試合併 main
git merge origin/main

# 4. 編輯衝突文件，解決衝突

# 5. 提交解決
git add .
git commit -m "fix: 解決 main 到 develop 的合併衝突"

# 6. 推送回遠端
git push origin develop
\`\`\`

#### 方案 B：使用衝突解決分支
基於此分支 \`${conflictBranch}\` 執行上述步驟 2-6。

### 注意事項
⚠️ **請優先處理此衝突**，以確保 develop 分支與 main 保持同步。
衝突未解決前，後續的 main 更新將無法自動同步到 develop。

---
*此 PR 由 GitHub Actions 自動生成*
`,
              head: conflictBranch,
              base: 'develop'
            });

            console.log(`✅ 已創建衝突解決 PR：#${pr.number}`);
            console.log(`📍 URL：${pr.html_url}`);

      # 步驟 8：輸出同步結果
      - name: 輸出同步結果
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 分支同步執行結果"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ "${{ steps.merge.outputs.merge_status }}" = "success" ]; then
            echo "✅ 狀態：分支同步成功"
            echo "📍 操作：main → develop"
            echo "⏰ 完成時間：${{ steps.prepare-merge.outputs.timestamp }}"
          else
            echo "⚠️ 狀態：分支同步發生衝突"
            echo "📌 衝突分支：${{ steps.conflict-branch.outputs.branch_name }}"
            echo "👉 操作：已自動創建 PR 進行手動解決"
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
